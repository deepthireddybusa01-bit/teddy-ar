function glueFace() {
  let mesh; model.traverse(o => { if (o.isSkinnedMesh && !mesh) mesh = o; });

  const L = [], R = [];

  for (let i = 0; i < pos.count; i++) {
    const u = uv.getX(i), w = uv.getY(i);
    const isEye = Math.abs(u - 0.875) < 0.003 && (Math.abs(w - 0.21875) < 0.003 || Math.abs(w - 0.78125) < 0.003);
    if (!isEye) continue;

    if (v.y < headY) continue;                                   // only the eyes on the head

  if (!L.length || !R.length) { console.warn('[teddy] eyes not found'); return; }

    c.z = Math.max(...arr.map(p => p.z)); return c; };
  const eL = centre(L), eR = centre(R), d = eL.distanceTo(eR);

    const n = new THREE.Vector3(Math.sin(tiltY), 0, Math.cos(tiltY));
    part.quaternion.copy(hqi.clone().multiply(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n)));
    part.scale.set(w / s.x, h / s.y, 1);

  attach(eyeL, eL.clone().add(new THREE.Vector3(0, 0, 0.004)), d * 0.72, d * 0.72);
  attach(eyeR, eR.clone().add(new THREE.Vector3(0, 0, 0.004)), d * 0.72, d * 0.72);

}

function go(name) {

  for (const a of Object.values(actions)) if (a !== next && a.enabled && a.getEffectiveWeight() > 0.001) { a.paused = false; a.fadeOut(FADE); }
  if (next === current && next.isRunning() && name === 'Idle') {

  } else {
    const w = next.isRunning() ? next.getEffectiveWeight() : 0;
    next.reset(); next.setEffectiveWeight(1); next.play();          // full weight is the target...
    next._scheduleFading(FADE, w, 1);                                // ...faded in from whatever it showed before

  else if (T < 2.7) { w = 0.8 + 0.2 * ease((T - 1.5) / 1.2); goal = P.clone().lerp(S, ease((T - 1.5) / 1.2)); }

    bloom.scale.setScalar(Math.max(0.001, easeOutBack(Math.min(1, bt / 1.2))) * (1 + (T > 3.2 && T < 5 ? Math.sin(T * 10) * 0.04 : 0)));
  }
  if (T > 4.3 && !can.userData.burst) { can.userData.burst = true; const p = new THREE.Vector3(0, 0.45, 0); plant.localToWorld(p); spawnHearts(5, p); }
  if (T > 6.8 && phase === 'water') { can.userData.burst = false; can.visible = false; turnY = 0; runNext(); }
}
function orientCan() {
  if (!can.visible) return;
  can.parent.updateMatrixWorld(true);
  const cp = new THREE.Vector3(); can.getWorldPosition(cp); root.worldToLocal(cp);
  const pp = plant.position.clone().add(new THREE.Vector3(0, 0.3, 0));
  const yaw = Math.atan2(-(pp.z - cp.z), pp.x - cp.x);
  const pour = can.userData.pour || 0;
  const wq = rootQ().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, -0.75 * pour, 'YXZ')));
  const pq = new THREE.Quaternion(); can.parent.getWorldQuaternion(pq);
  can.quaternion.copy(pq.invert().multiply(wq));
  const hs = new THREE.Vector3().setFromMatrixScale(can.parent.matrixWorld).x / root.scale.x;
  const pop = can.userData.pop === undefined ? 1 : can.userData.pop;
  can.scale.setScalar(Math.max(0.001, pop) * 1.35 * modelHeight / hs);
}

// ============================ expressions ============================
let nextBlink = 1.5, blinkUntil = 0;
const fade = (m, target, dt, speed = 8) => { m.material.opacity += (target - m.material.opacity) * Math.min(1, dt * speed); };
function updateFace(t, dt) {
  let eyes = null, wink = false, blush = 0.4;
  if (phase === 'wave') { eyes = 'happy'; blush = 0.9; }
  else if (phase === 'water') { blush = 0.8; if (waterT > 2 && waterT < 5.5) eyes = 'happy'; }
  else if (phase === 'pocket') { blush = 0.6; if (pocketT > 2.7 && pocketT < 5.2) { eyes = 'happy'; blush = 1; } }
  else if (phase === 'kiss') {
    const p = current.time / current.getClip().duration; blush = 1;
    if (p > KISS_RELEASE - 0.15 && p < KISS_RELEASE + 0.05) eyes = 'closed';
    else if (p >= KISS_RELEASE + 0.05 && p < KISS_RELEASE + 0.3) wink = true;
    if (!kissFired && p >= KISS_RELEASE) { kissFired = true; const hp = new THREE.Vector3(); (bones.RightHand || bones.Head).getWorldPosition(hp); spawnHearts(7, hp); dropGift(); }
  } else {
    if (t > nextBlink) { blinkUntil = t + 0.14; nextBlink = t + 2 + Math.random() * 2.5; }
    if (t < blinkUntil) eyes = 'closed';
    blush = 0.4 + 0.3 * Math.max(0, Math.sin(t * 2));
  }
  if (eyes) eyeL.material.map = eyeR.material.map = eyeTex[eyes];
  if (wink) eyeR.material.map = eyeTex.closed;
  fade(eyeL, eyes ? 1 : 0, dt, 14); fade(eyeR, (eyes || wink) ? 1 : 0, dt, 14);
  fade(blushL, blush, dt); fade(blushR, blush, dt);
}

// ============================ floating 3D buttons (AR) ============================
const MOVES = [['hi', '\u{1F44B}'], ['keychain', '\u{1F496}'], ['kiss', '\u{1F48B}'], ['water', '\u{1F331}']];
function bubbleTex(emoji, active) {
  return canvasTex((g, w, h) => {
    const r = g.createRadialGradient(w * 0.38, h * 0.32, 4, w / 2, h / 2, w * 0.48);
    if (active) { r.addColorStop(0, '#ffe0ee'); r.addColorStop(0.6, '#ff9cc4'); r.addColorStop(1, '#f07aaa'); }
    else { r.addColorStop(0, '#ffffff'); r.addColorStop(0.6, '#ffe6f0'); r.addColorStop(1, '#ffc4da'); }
    g.fillStyle = r; g.beginPath(); g.arc(w / 2, h / 2, w * 0.46, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = w * 0.03; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.beginPath(); g.ellipse(w * 0.36, h * 0.27, w * 0.12, h * 0.06, -0.5, 0, Math.PI * 2); g.fill();
    g.font = `${Math.round(w * 0.46)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(emoji, w / 2, h * 0.54);
  }, 256, 256);
}
const arButtons = new THREE.Group(); arButtons.visible = false; root.add(arButtons);
const bubbleHits = [];
MOVES.forEach(([name, emoji], i) => {
  const b = new THREE.Group();
  const texOff = bubbleTex(emoji, false), texOn = bubbleTex(emoji, true);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: texOff, transparent: true, depthWrite: false, toneMapped: false }));
  spr.scale.setScalar(0.17);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hit.userData.move = name;
  b.add(spr, hit); b.position.set(0.95, 0.95 - i * 0.22, 0.05);
  b.userData = { spr, texOff, texOn, name, base: b.position.y, phase: i * 0.9 };
  arButtons.add(b); bubbleHits.push(hit);
});
function updateArButtons(t) {
  if (!arButtons.visible) return;
  const active = document.querySelector('#moves button.on');
  for (const b of arButtons.children) {
    const on = active && active.dataset.move === b.userData.name;
    b.position.y = b.userData.base + Math.sin(t * 1.6 + b.userData.phase) * 0.015;
    b.userData.spr.material.map = on ? b.userData.texOn : b.userData.texOff;
    const target = on ? 0.2 : 0.17; b.userData.spr.scale.setScalar(b.userData.spr.scale.x + (target - b.userData.spr.scale.x) * 0.2);
  }
}
function pressBubble(rayCaster) {
  if (!arButtons.visible) return false;
  const hit = rayCaster.intersectObjects(bubbleHits, false)[0];
  if (!hit) return false;
  const b = hit.object.parent; b.userData.spr.scale.setScalar(0.13);   // little press squish
  queue = []; startAction(hit.object.userData.move);
  return true;
}

// ============================ input / AR ============================
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('click', (e) => {
  if (renderer.xr.isPresenting || !model) return;
  const cam = viewCam(); cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam);
  if (pressBubble(ray)) return;
  if (ray.intersectObject(model, true).length) startShow();
});
let reticle, hitSource = null, placedOnce = false;
async function setupAR() {
  const floorOK = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!floorOK) {
    // iPhone: Variant Launch provides WebXR inside its App Clip viewer
    const launch = () => { const url = window.VLaunch && VLaunch.getLaunchUrl
        ? VLaunch.getLaunchUrl(location.origin + location.pathname + '?autoar=1') : null;
      if (url) location.href = url; else hint.textContent = 'AR is getting ready, please tap again in a moment'; };
    arBtn.disabled = false; arBtn.textContent = 'Start AR'; arBtn.onclick = launch;
    window.addEventListener('vlaunch-initialized', () => { arBtn.disabled = false; });
    return;
  }
  reticle = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
  const enterAR = async () => {
    const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local', 'hit-test'], optionalFeatures: ['dom-overlay', 'anchors'], domOverlay: { root: document.body } });
    renderer.xr.setReferenceSpaceType('local'); await renderer.xr.setSession(session);
    root.visible = false; root.scale.setScalar(AR_HEIGHT / modelHeight);
    hint.textContent = 'Point at the floor, then tap to place teddy'; arBtn.style.display = 'none';
    document.getElementById('moves').style.display = 'none';
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
    session.addEventListener('select', (e) => {
      // tapped one of the floating buttons?
      if (root.visible && arButtons.visible) {
        const pose = e.frame.getPose(e.inputSource.targetRaySpace, renderer.xr.getReferenceSpace());
        if (pose) {
          const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
          ray.ray.origin.setFromMatrixPosition(m);
          ray.ray.direction.set(0, 0, -1).transformDirection(m);
          if (pressBubble(ray)) return;
        }
      }
      if (!reticle.visible) return;
      root.position.setFromMatrixPosition(reticle.matrix);
      const cam = new THREE.Vector3(); renderer.xr.getCamera().getWorldPosition(cam);
      root.rotation.y = Math.atan2(cam.x - root.position.x, cam.z - root.position.z);
      root.visible = true; arButtons.visible = true;
      if (!placedOnce) { placedOnce = true; startShow(); } else { queue = []; startAction('hi'); }
      hint.textContent = 'Tap a floating bubble to see each movement \u00b7 tap the floor to move teddy';
    });
    session.addEventListener('end', () => { hitSource = null; reticle.visible = false; root.visible = true;
      root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.setScalar(1);
      arBtn.style.display = ''; document.getElementById('moves').style.display = ''; arButtons.visible = false;
      hint.textContent = 'Tap a button to see each movement · drag to look around'; });
  };
  const tryEnterAR = () => enterAR().catch(e => { console.error(e); hint.textContent = 'AR could not start: ' + (e.message || e); });
  arBtn.disabled = false; arBtn.textContent = 'Start AR'; arBtn.onclick = tryEnterAR;
  // opened from the iPhone launcher (Variant Launch viewer): go straight into AR
  if (new URLSearchParams(location.search).has('autoar')) tryEnterAR();
}

// ============================ AR on the printed card (MindAR image tracking; works on iPhone + Android) ============================
const MINDAR_URL = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';
let mindarModule = null;
function preloadCardAR() {                       // warm everything up so "Start AR" is quick
  if (mindarModule) return mindarModule;
  mindarModule = import(MINDAR_URL);
  fetch('targets.mind').catch(() => {});
  return mindarModule;
}
const CARD_SCALE = 0.8;          // teddy height = 0.8 x card width (print the card bigger for a bigger teddy)
let cardHolder = null, cardShown = false;
async function startCardAR() {
  if (cardAR || starting) return;
  if (!model) { hint.textContent = 'Teddy is still loading, one moment…'; return; }
  starting = true; arBtn.disabled = true; arBtn.textContent = 'Preparing AR…';
  hint.textContent = 'Preparing AR (first time can take a few seconds)…';
  try { await startCardARInner(); }
  catch (e) {
    console.error(e);
    const msg = String(e && (e.name || e.message) || e);
    hint.textContent = /NotAllowed|Permission/i.test(msg) ? 'Camera permission was blocked – allow the camera in your browser settings and try again'
                     : 'AR could not start (' + msg + '). Please reload and try again.';
    document.getElementById('arContainer').style.display = 'none';
  } finally { starting = false; arBtn.disabled = false; arBtn.textContent = 'Start AR'; }
}
let starting = false;
async function startCardARInner() {
  const { MindARThree } = await preloadCardAR();
  hint.textContent = 'Starting camera…';
  const container = document.getElementById('arContainer'); container.style.display = 'block';
  const m = new MindARThree({ container, imageTargetSrc: 'targets.mind', uiLoading: 'yes', uiScanning: 'yes', uiError: 'yes',
                              filterMinCF: 0.0001, filterBeta: 0.001 });
  const anchor = m.addAnchor(0);
  scene.add(anchor.group);                                       // render the anchor with our own renderer/scene
  cardHolder = new THREE.Group(); cardHolder.rotation.x = Math.PI / 2;   // stand up on the card
  cardHolder.position.set(0, -0.12, 0); anchor.group.add(cardHolder);
  cardHolder.add(root); root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.setScalar(CARD_SCALE / modelHeight);
  arButtons.visible = true;
  anchor.onTargetFound = () => { hint.textContent = 'Tap a floating bubble to see each movement';
    if (!cardShown) { cardShown = true; startShow(); } };
  anchor.onTargetLost = () => { hint.textContent = 'Point your camera at the card'; };
  m.renderer.domElement.style.display = 'none';                  // we draw with our own renderer on top of the video
  await m.start();
  hint.textContent = 'Point your camera at the card';
  cardAR = m; document.body.classList.add('card'); renderer.setClearColor(0x000000, 0);
  document.getElementById('exitCard').style.display = ''; hint.textContent = 'Point your camera at the card';
}
async function stopCardAR() {
  if (!cardAR) return;
  cardAR.stop(); cardAR = null; cardShown = false;
  scene.add(root); root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.setScalar(1); root.visible = true;
  document.getElementById('arContainer').style.display = 'none'; document.getElementById('arContainer').innerHTML = '';
  document.body.classList.remove('card'); document.getElementById('exitCard').style.display = 'none';
  arButtons.visible = false; hint.textContent = 'Tap a button to see each movement · drag to look around';
}
document.getElementById('exitCard').onclick = stopCardAR;

// ============================ loop ============================
let paused = false;   // test hook (window.__teddy.pause)
renderer.setAnimationLoop((_, frame) => {
  const dt0 = Math.min(clock.getDelta(), 0.1), dt = paused ? 0 : dt0, t = clock.elapsedTime;
  if (mixer) {
    mixer.update(dt);
    if (phase === 'pocket') updatePocket(dt); else if (phase === 'water') updateWater(dt); else { ikWeight = 0; turnY = 0; }
    // ease the arm and body toward their targets so switching movements never snaps
    const kk = Math.min(1, dt * 3.5);
    if (!ikInit.done || ikW < 0.01) { ikT.copy(ikTarget); ikInit.done = true; } else ikT.lerp(ikTarget, kk);
    ikW += (ikWeight - ikW) * kk;
    model.rotation.y += (turnY - model.rotation.y) * Math.min(1, dt * 6);
    if (ikW > 0.001) { model.updateMatrixWorld(true); solveArm(ikT, ikW); }
    orientKeychain(); orientCan();
    if (phase === 'water' && can.visible && (can.userData.pour || 0) > 0.6 && Math.random() < 0.8) spawnDrop();   // after arm + can are posed
    updateFace(t, dt);
  }
  updateHearts(dt); updateGift(dt); updateButterflies(t); updateDrops(dt); updateArButtons(t);
  const happy = plant.userData.happy || 0; plant.userData.hs = (plant.userData.hs || 0) + (happy - (plant.userData.hs || 0)) * Math.min(1, dt * 3);
  plant.children.forEach(c => { if (c.userData.sway !== undefined) c.rotation.z = Math.sin(t * (1.2 + plant.userData.hs * 6) + c.userData.sway) * (0.04 + plant.userData.hs * 0.12); });
  if (frame && hitSource) {
    const hits = frame.getHitTestResults(hitSource);
    if (hits.length) { reticle.visible = true; reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix); } else reticle.visible = false;
  }
  renderer.render(scene, cardAR ? cardAR.camera : camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__teddy = { go, startShow, startAction };
</script>
